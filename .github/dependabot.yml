version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Remove when the coordinated Node 26 runtime and type migration begins.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Remove when the Vite 8 migration is approved and planned.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # Keep in step with engines.vscode so the compiler still rejects APIs
      # missing from the minimum supported VS Code. Minor updates are ignored
      # too: 1.74 -> 1.137 is a semver-minor bump.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
